name: Android

on:
  push:
    branches: [main]
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"

jobs:
  probe:
    name: Maitri probe compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android/probe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build probe
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  app:
    name: Gradle assemble
    runs-on: ubuntu-latest
    needs: probe
    defaults:
      run:
        working-directory: Android/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Default setup-android only installs tools + platform-tools; Gradle still needs
      # the API 36 platform and build-tools for compileSdk 36.
      - name: Install Android SDK platform and build-tools
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || \
            yes | sdkmanager "platforms;android-36" "build-tools;35.0.1" >/dev/null

      - name: Assemble debug and release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmu-attendance-android-release
          path: Android/app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
